<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Konfirmasi Pembayaran</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Panel Admin</h1>
      <p class="sub">Konfirmasi atau tolak pengajuan pembayaran dari user.</p>
    </header>

    <section class="card" id="loginCard">
      <h2>Masuk</h2>
      <form id="loginForm">
        <label>Password admin
          <input type="password" name="key" required>
        </label>
        <button type="submit">Masuk</button>
      </form>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section class="card hidden" id="listCard">
      <h2>Pengajuan Pembayaran</h2>
      <button id="refreshBtn" type="button">Muat Ulang</button>
      <div id="list"></div>
    </section>

    <footer><a href="index.html">Kembali ke halaman user</a></footer>
  </div>
  <script src="admin.js"></script>
</body>
</html>
